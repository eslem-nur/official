<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App | Eslem Nur Çetin</title>
    <meta name="author" content="Eslem Nur Çetin">
      <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        /* ============================================
   WEATHER APP — İlim ve Kod tasarım sistemi
   ============================================ */

:root {
    /* Ana site paleti */
    --primary-color: #A06872;
    --primary-dark: #8E5A65;
    --primary-light: #CC8E98;

    --secondary-color: #FDF5E6;
    --accent-color: #9E7F7F;
    --accent-warm: #E6C9C9;

    --bg-color: #FFF9F9;
    --bg-secondary: #FFF0F5;
    --card-bg: #FFFFFF;
    --card-secondary: #FDF5F5;
    --note-bg: #FFF0F5;

    --text-primary: #4E342E;
    --text-secondary: #8D6E63;
    --text-muted: #A89080;

    --border-color: #F0E6E6;
    --button-bg: #D4A5A5;
    --button-hover: #C58F8F;

    --success-color: #388E3C;

    --shadow-sm: 0 2px 8px rgba(183, 110, 121, 0.1);
    --shadow-md: 0 4px 15px rgba(183, 110, 121, 0.15);
    --shadow-lg: 0 8px 25px rgba(183, 110, 121, 0.2);

    --transition-base: 0.3s ease;
    --transition-bounce: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.27);

    --radius-sm: 8px;
    --radius-md: 16px;
    --radius-lg: 20px;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', sans-serif;
    background: linear-gradient(135deg, var(--bg-color) 0%, var(--note-bg) 100%);
    color: var(--text-primary);
    line-height: 1.7;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.weather-app-container {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    padding: 30px;
    border-radius: var(--radius-lg);
    width: 100%;
    max-width: 420px;
    text-align: center;
    box-shadow: var(--shadow-md);
    transition: box-shadow var(--transition-base);
}

.weather-app-container:hover {
    box-shadow: var(--shadow-lg);
}

h1 {
    font-family: 'Playfair Display', 'Georgia', serif;
    font-size: 1.8rem;
    font-weight: 700;
    margin-bottom: 20px;
    background: linear-gradient(90deg, var(--primary-color), var(--primary-dark));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

h1::after {
    content: '✿';
    display: block;
    font-size: 1.2rem;
    color: var(--accent-color);
    -webkit-text-fill-color: var(--accent-color);
    margin-top: 6px;
}

/* ---------- Kontroller ---------- */

.controls {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

select {
    flex: 2;
    padding: 12px 14px;
    background: var(--card-secondary);
    border: 2px solid var(--border-color);
    color: var(--text-primary);
    border-radius: var(--radius-sm);
    outline: none;
    font-family: inherit;
    font-size: 0.95rem;
    min-height: 48px;
    transition: all var(--transition-base);
    cursor: pointer;
}

select:focus {
    border-color: var(--primary-color);
    box-shadow: 0 0 0 3px rgba(183, 110, 121, 0.1);
}

select option {
    background: var(--card-bg);
    color: var(--text-primary);
}

button {
    flex: 1;
    background: var(--button-bg);
    border: none;
    color: #fff;
    font-family: inherit;
    font-weight: 600;
    font-size: 0.95rem;
    border-radius: var(--radius-sm);
    min-height: 48px;
    cursor: pointer;
    transition: all var(--transition-bounce);
}

button:hover {
    background: var(--button-hover);
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
}

button:active {
    transform: translateY(0);
}

/* ---------- Hava Durumu Bilgisi ---------- */

#weather-info {
    margin-top: 20px;
}

#location {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--primary-color);
}

#weather-main {
    font-size: 1rem;
    color: var(--text-secondary);
    margin-top: 4px;
}

#weather-icon {
    width: 80px;
    height: 80px;
    filter: drop-shadow(var(--shadow-sm));
}

#main-temperature {
    font-size: 2.5rem;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 20px;
}

/* ---------- Detay Kartları ---------- */

.weather-details {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    text-align: left;
}

.detail-card {
    background: var(--note-bg);
    border: 1px solid var(--border-color);
    padding: 12px;
    border-radius: var(--radius-sm);
    transition: all var(--transition-base);
}

.detail-card:hover {
    border-color: var(--primary-light);
    box-shadow: var(--shadow-sm);
}

.detail-label {
    font-size: 0.75rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
}

.detail-value {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--text-primary);
    margin-top: 2px;
}

/* ============================================
   COPYRIGHT STILI (Opsiyonel)
   ============================================ */

#copyright-year {
  font-weight: 600;
  color: var(--primary-color, #A06872);
}

/* Footer içindeyse */
.site-footer .copyright-line {
  text-align: center;
  padding: 24px 16px;
  border-top: 1px solid var(--border-color, #F0E6E6);
  color: var(--text-muted, #A89080);
  font-size: 0.9rem;
}

.site-footer p {
  margin: 0 0 8px 0;
}
    </style>
</head>
<body>

    <div class="weather-app-container">
        <h1>Weather Dashboard</h1>
        
        <div class="controls">
            <select id="city-select">
                <option value=""></option>
                <option value="new york">New York</option>
                <option value="los angeles">Los Angeles</option>
                <option value="chicago">Chicago</option>
                <option value="paris">Paris</option>
                <option value="tokyo">Tokyo</option>
                <option value="london">London</option>
            </select>
                        <button id="get-weather-btn" class="btn-primary">Get Weather</button>
        </div>

        <div id="weather-info">
            <div id="location"></div>
            <div id="weather-main"></div>
            <img id="weather-icon" src="" alt="Weather Icon">
            <div id="main-temperature"></div>
            
            <div class="weather-details">
                <div class="detail-card">
                    <div class="detail-label">Feels Like</div>
                    <div id="feels-like" class="detail-value"></div>
                </div>
                <div class="detail-card">
                    <div class="detail-label">Humidity</div>
                    <div id="humidity" class="detail-value"></div>
                </div>
                <div class="detail-card">
                    <div class="detail-label">Wind Speed</div>
                    <div id="wind" class="detail-value"></div>
                </div>
                <div class="detail-card">
                    <div class="detail-label">Wind Gust</div>
                    <div id="wind-gust" class="detail-value"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // User Story: getWeather Funktion
async function getWeather(city) {
  try {
    const response = await fetch(`https://weather-proxy.freecodecamp.rocks/api/city/${city}`);
    
    if (!response.ok) {
      throw new Error(`HTTP error! status: ${response.status}`);
    }

    const data = await response.json();

    if (data.error) {
      throw new Error(data.error);
    }

    return data;
  } catch (error) {
    console.log(error);
    return undefined;
  }
}

// User Story: showWeather Funktion
async function showWeather(city) {
  // Wenn keine Stadt ausgewählt ist, nichts tun
  if (!city) return;

  const weatherData = await getWeather(city);

  if (weatherData === undefined) {
    alert("Something went wrong, please try again later.");
    return;
  }

  const icon = weatherData.weather?.[0]?.icon || '';
  const location = weatherData.name || 'N/A';
  const weatherMain = weatherData.weather?.[0]?.main || 'N/A';
  const temp = weatherData.main?.temp !== undefined ? weatherData.main.temp : 'N/A';
  const feelsLike = weatherData.main?.feels_like !== undefined ? weatherData.main.feels_like : 'N/A';
  const humidity = weatherData.main?.humidity !== undefined ? weatherData.main.humidity : 'N/A';
  const windSpeed = weatherData.wind?.speed !== undefined ? weatherData.wind.speed : 'N/A';
  const windGust = weatherData.wind?.gust !== undefined ? weatherData.wind.gust : 'N/A';

  // DOM Elemente aktualisieren
  document.getElementById('weather-icon').src = icon;
  document.getElementById('location').textContent = location;
  document.getElementById('weather-main').textContent = weatherMain;
  document.getElementById('main-temperature').textContent = temp;
  document.getElementById('feels-like').textContent = feelsLike;
  document.getElementById('humidity').textContent = humidity;
  document.getElementById('wind').textContent = windSpeed;
  document.getElementById('wind-gust').textContent = windGust;
}

// Event Listener für den Button
document.getElementById('get-weather-btn').addEventListener('click', () => {
  const selectElement = document.getElementById('city-select');
  const selectedCity = selectElement.value;
  
  if (selectedCity === '') return;

  showWeather(selectedCity);
});
    </script>
</body>
</html>
