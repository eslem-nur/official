<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Görüş & Öneri Formu • Eslem Nur Çetin</title>
    <meta name="description" content="Görüş ve öneri formu">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Fontlar -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;700&family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../style-sheets/gorus-formu.css">
</head>

<body>
    <div class="wrapper">
      
      <button id="themeToggle" class="theme-toggle" aria-label="Temayı Değiştir">
            <i class="fas fa-moon"></i>
        </button>

        <div class="basmala">بِسْمِ ٱللَّٰهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>

        <h1 id="title">Görüş &amp; Öneri Formu</h1>
        <p id="description">
            Siteyi geliştirmeme yardımcı olmak için birkaç dakikanızı ayırır mısınız?
        </p>

        <form id="survey-form">

          <!-- WEB3FORMS AYARLARI -->
    <input type="hidden" name="access_key" value="access-key-buraya">
    <input type="hidden" name="subject" value="Yeni Görüş & Öneri Formu Mesajı">
    <input type="hidden" name="from_name" value="Eslem Nur Çetin Web Sitesi">

    <!-- SPAM TUZAĞI (botlar doldurur, insanlar görmez) -->
    <input type="checkbox" name="botcheck" tabindex="-1" autocomplete="off"
           style="display:none !important" aria-hidden="true">
          
            <div class="form-row">
                <div class="form-group">
                    <label for="name" id="name-label">Adınız</label>
                    <input type="text" id="name" name="name"
                           placeholder="Adınız Soyadınız" required>
                </div>

                <div class="form-group">
                    <label for="email" id="email-label">E-posta</label>
                    <input type="email" id="email" name="email"
                           placeholder="ornek@email.com" required>
                </div>
            </div>

            <div class="form-group">
                <label for="number" id="number-label">Yaşınız (isteğe bağlı)</label>
                <input type="number" id="number" name="age"
                       placeholder="Yaş" min="10" max="99">
            </div>

            <div class="form-group">
                <label for="dropdown" id="dropdown-label">
                    Sizi en iyi tanımlayan nedir?
                </label>
                <select id="dropdown" name="role">
                    <option value="">Seçiniz</option>
                    <option value="ilim-talebesi">İlim Talebesi</option>
                    <option value="ogrenci">Öğrenci</option>
                    <option value="calisan">Tam Zamanlı Çalışan</option>
                    <option value="veli">Veli</option>
                    <option value="diger">Diğer</option>
                </select>
            </div>

            <fieldset>
                <legend>Siteyi bir yakınınıza tavsiye eder misiniz?</legend>
                <label class="choice">
                    <input type="radio" name="recommend" value="kesinlikle" checked>
                    <span>Kesinlikle</span>
                </label>
                <label class="choice">
                    <input type="radio" name="recommend" value="belki">
                    <span>Belki</span>
                </label>
                <label class="choice">
                    <input type="radio" name="recommend" value="emin-degilim">
                    <span>Emin değilim</span>
                </label>
            </fieldset>

            <fieldset>
                <legend>Neyi geliştirmemi istersiniz? (Birden fazla seçebilirsiniz)</legend>
                <label class="choice">
                    <input type="checkbox" name="improve" value="dijital-notlar">
                    <span>Dijital Notlar</span>
                </label>
                <label class="choice">
                    <input type="checkbox" name="improve" value="web-uygulamalari">
                    <span>Web Uygulamaları</span>
                </label>
                <label class="choice">
                    <input type="checkbox" name="improve" value="shop">
                    <span>Shop Ürünleri</span>
                </label>
                <label class="choice">
                    <input type="checkbox" name="improve" value="tasarim">
                    <span>Tasarım ve Okunabilirlik</span>
                </label>
                <label class="choice">
                    <input type="checkbox" name="improve" value="icerik">
                    <span>Yeni İçerik</span>
                </label>
            </fieldset>

            <div class="form-group">
                <label for="comments">Yorum ve önerileriniz</label>
                <textarea id="comments" name="comments" rows="6"
                          placeholder="Düşüncelerinizi buraya yazabilirsiniz..."></textarea>
            </div>

           <div id="formFeedback" class="form-feedback" style="display: none;"></div>

<button type="submit" id="submit">Gönder</button>

        </form>
    </div>
  <script src="../scripts/gorus-formu.js"></script>
</body>
</html>
